name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "calculator/**"]
  pull_request:
    paths: ["converter/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the friendly windowed app (drag & drop, mascot icon)
          - os: windows-latest
            asset: PrimeDF-windows-x64.exe
            exe: PrimeDF.exe
            pyinstaller: --windowed --name PrimeDF --icon build/primedf.ico converter/packaging/primedf_gui_entry.py
            smoke: --cli
            smoke_gui: --gui-selftest
          # Linux / macOS: command-line tool (opens the window when run without arguments)
          - os: ubuntu-latest
            asset: primedf-linux-x64
            exe: primedf
            pyinstaller: --console --name primedf converter/packaging/primedf_entry.py
          - os: macos-latest
            asset: primedf-macos-arm64
            exe: primedf
            pyinstaller: --console --name primedf converter/packaging/primedf_entry.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install converter and PyInstaller
        run: pip install ./converter pyinstaller
      - name: Draw the icon
        run: python converter/packaging/make_icon.py build/primedf.ico
      - name: Build single-file executable
        run: >
          pyinstaller --onefile --noconfirm
          --collect-all pypdfium2 --collect-all pypdfium2_raw
          --distpath dist --workpath build/pyi
          ${{ matrix.pyinstaller }}
      - name: Install smoke-test helper (not bundled)
        run: pip install PyMuPDF
      - name: Smoke test
        run: python converter/packaging/smoke_test.py "dist/${{ matrix.exe }}" ${{ matrix.smoke }}
      - name: Smoke test (real window)
        if: matrix.smoke_gui
        run: python converter/packaging/smoke_test.py "dist/${{ matrix.exe }}" ${{ matrix.smoke_gui }}
      - name: Report size
        run: ls -la dist/
      - name: Rename asset
        run: mv "dist/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp calculator/PrimeDF.hpppl dist/
          chmod +x dist/primedf-linux-x64 dist/primedf-macos-arm64
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PrimeDF $GITHUB_REF_NAME" --generate-notes
