name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["converter/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the friendly windowed app (drag & drop, mascot icon)
          - os: windows-latest
            asset: PrimeDF-windows-x64.exe
            exe: PrimeDF.exe
            pyinstaller: --windowed --name PrimeDF --icon build/primedf.ico converter/packaging/primedf_gui_entry.py
            smoke: --cli
            smoke_gui: --gui-selftest
          # Linux / macOS: command-line tool (opens the window when run without arguments)
          - os: ubuntu-latest
            asset: primedf-linux-x64
            exe: primedf
            pyinstaller: --console --name primedf converter/packaging/primedf_entry.py
          - os: macos-latest
            asset: primedf-macos-arm64
            exe: primedf
            pyinstaller: --console --name primedf converter/packaging/primedf_entry.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install converter and PyInstaller
        run: pip install ./converter pyinstaller
      - name: Draw the icon
        run: python converter/packaging/make_icon.py --ico build/primedf.ico --preview build/preview/icon.png --app-icon build/preview/app-icon-38.png
      - name: Build single-file executable
        run: >
          pyinstaller --onefile --noconfirm
          --collect-all pypdfium2 --collect-all pypdfium2_raw
          --distpath dist --workpath build/pyi
          ${{ matrix.pyinstaller }}
      - name: Install smoke-test helper (not bundled)
        run: pip install PyMuPDF
      - name: Smoke test
        run: python converter/packaging/smoke_test.py "dist/${{ matrix.exe }}" ${{ matrix.smoke }}
      - name: Smoke test (real window)
        if: matrix.smoke_gui
        run: python converter/packaging/smoke_test.py "dist/${{ matrix.exe }}" ${{ matrix.smoke_gui }}
      - name: Screenshot the window
        if: matrix.smoke_gui
        continue-on-error: true
        shell: pwsh
        env:
          PRIMEDF_SELFTEST_LINGER_MS: "8000"
        run: |
          python -c "import pymupdf; d = pymupdf.open(); [d.new_page().insert_text((72, 100), 'Hello Prime') for _ in range(4)]; d.save('build/preview/Lecture Notes.pdf')"
          $p = Start-Process dist/PrimeDF.exe -ArgumentList '--gui-selftest', "`"$PWD\build\preview\Lecture Notes.pdf`"" -PassThru
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\build\preview\window.png")
          $p.WaitForExit()
      - name: Upload previews
        if: matrix.smoke_gui
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: |
            build/preview/*.png
      - name: Report size
        run: ls -la dist/
      - name: Rename asset
        run: mv "dist/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  calculator-app:
    name: PrimeDF.hpappdir (calculator app package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ./converter
      - name: Check the program
        run: python3 tools/check_ppl.py calculator/PrimeDF.hpppl
      - name: Draw the 38x38 app icon
        run: python converter/packaging/make_icon.py --app-icon build/icon.png
      - name: Build the app package from the exported template
        run: >
          python3 tools/hpprime_tlv.py build-app
          --template calculator/app-template/PRIMEDF.hpappdir
          --program calculator/PrimeDF.hpppl
          --icon build/icon.png
          --out pkg/PRIMEDF.hpappdir
      - name: Verify the package
        run: |
          python3 tools/hpprime_tlv.py check pkg/PRIMEDF.hpappdir/*
          python3 tools/hpprime_tlv.py extract-program pkg/PRIMEDF.hpappdir/PRIMEDF.hpappprgm build/embedded.hpppl
          tr -d '\r' < calculator/PrimeDF.hpppl | cmp - build/embedded.hpppl
          echo "embedded program matches calculator/PrimeDF.hpppl"
      - name: Zip
        run: cd pkg && zip -r ../PrimeDF.hpappdir.zip PRIMEDF.hpappdir
      - uses: actions/upload-artifact@v4
        with:
          name: PrimeDF.hpappdir.zip
          path: PrimeDF.hpappdir.zip
          if-no-files-found: error
      - name: Build the boot-test package (minimal program, same template)
        run: |
          python3 tools/check_ppl.py calculator/tests/boot.hpppl
          python3 tools/hpprime_tlv.py build-app \
            --template calculator/app-template/PRIMEDF.hpappdir \
            --program calculator/tests/boot.hpppl \
            --icon build/icon.png \
            --out boot/PRIMEDF.hpappdir
          python3 tools/hpprime_tlv.py check boot/PRIMEDF.hpappdir/*
          cd boot && zip -r ../boot-test.hpappdir.zip PRIMEDF.hpappdir
      - uses: actions/upload-artifact@v4
        with:
          name: boot-test.hpappdir.zip
          path: boot-test.hpappdir.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, calculator-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*rime*"  # the binaries and the app package, not the previews
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp calculator/PrimeDF.hpppl dist/
          chmod +x dist/primedf-linux-x64 dist/primedf-macos-arm64
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PrimeDF $GITHUB_REF_NAME" --generate-notes
