name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  converter:
    name: converter (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: converter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - run: ruff check --output-format=github .
      - run: pytest -v

  ppl:
    name: PPL sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check block balance and required entry points
        run: python3 tools/check_ppl.py calculator/PrimeDF.hpppl calculator/tests/*.hpppl
      - name: Reference .hpappdir samples parse and round-trip byte-exactly
        run: python3 tools/hpprime_tlv.py check docs/format-samples/*/*.hpappdir/*
      - name: Program injection reproduces a real Connectivity Kit export byte-for-byte
        run: |
          python3 tools/hpprime_tlv.py extract-program docs/format-samples/02-with-program/PRIMEDF.hpappdir/PRIMEDF.hpappprgm /tmp/s02.hpppl
          python3 tools/hpprime_tlv.py build-app --template docs/format-samples/01-function-copy-no-program/PRIMEDF.hpappdir --program /tmp/s02.hpppl --out /tmp/rebuilt/PRIMEDF.hpappdir
          cmp /tmp/rebuilt/PRIMEDF.hpappdir/PRIMEDF.hpappprgm docs/format-samples/02-with-program/PRIMEDF.hpappdir/PRIMEDF.hpappprgm
          echo "rebuilt .hpappprgm is identical to the real export"
