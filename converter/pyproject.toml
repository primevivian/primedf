[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primedf"
dynamic = ["version"]
description = "Convert PDFs into page images for the PrimeDF reader on the HP Prime G2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30,<5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "PyMuPDF>=1.24.3"]  # PyMuPDF only generates test PDFs

[project.scripts]
primedf = "primedf.cli:main"

[project.gui-scripts]
primedf-gui = "primedf.gui:main"

[project.urls]
Homepage = "https://github.com/primevivian/primedf"
Issues = "https://github.com/primevivian/primedf/issues"

[tool.setuptools.dynamic]
version = { attr = "primedf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
